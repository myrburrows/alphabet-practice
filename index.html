<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14243a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Alphabet Practice</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
<script defer src="./app.js"></script>
</head><body><main class="wrap">
<header><div class="logo">A</div><div><h1>Alphabet Practice</h1><p>Your personal A–Z answer drill</p></div></header>
<div id="status" class="status" role="status">Loading answers…</div>
<section id="setup" class="panel" hidden><h2>Choose categories</h2><p>Select one, several, or all eight. With multiple categories, each letter gets a random category.</p>
<div class="actions"><button id="all" type="button" class="secondary">Select all</button><button id="none" type="button" class="secondary">Clear all</button></div>
<div id="categories" class="categories"></div><p id="selectionInfo" class="muted"></p>
<button id="start" type="button" class="primary wide">Start A–Z practice</button></section>
<section id="game" class="panel" hidden>
<div class="topline"><span id="progress"></span><span id="category" class="pill"></span></div>
<div id="letter" class="letter" aria-label="Current letter">A</div>
<label for="guess">Your memorized answer</label>
<form id="guessForm" autocomplete="off"><input id="guess" type="text" enterkeyhint="done" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Type your answer" aria-describedby="feedback"><button type="submit" class="primary">Submit</button></form>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div class="actions"><button id="hint" type="button" class="secondary">Hint — fill answer</button><button id="next" type="button" class="primary" disabled>Next letter →</button></div>
<div class="actions bottom"><button id="back" type="button" class="textbutton">Change categories</button></div>
</section>
<section id="finish" class="panel" hidden><h2>Round complete!</h2><p id="summary"></p><button id="again" class="primary wide">Practice again</button><button id="change" class="secondary wide">Change categories</button></section>
<footer>Alphabet Practice · v1.0 · <span id="count">208 answers</span></footer>
</main></body></html>
